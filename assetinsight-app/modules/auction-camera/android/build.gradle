plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jetbrains.kotlin.android'
}

group = 'expo.modules.auctioncamera'
version = '1.0.0'

android {
  namespace "expo.modules.auctioncamera"
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdk 24
    targetSdk rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0.0"
    ndk {
      abiFilters(*(findProperty("reactNativeArchitectures") ?: "armeabi-v7a,arm64-v8a,x86,x86_64").toString().split(","))
    }
  }

  ndkVersion rootProject.ext.ndkVersion

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  buildFeatures {
    viewBinding true
    dataBinding true
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  // CameraX
  def cameraxVersion = "1.5.3"
  implementation "androidx.camera:camera-core:$cameraxVersion"
  implementation "androidx.camera:camera-camera2:$cameraxVersion"
  implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
  implementation "androidx.camera:camera-view:$cameraxVersion"
  implementation "androidx.camera:camera-extensions:$cameraxVersion"
  implementation "androidx.camera:camera-video:$cameraxVersion"

  // AndroidX
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "androidx.activity:activity-ktx:1.12.4"
  implementation "androidx.fragment:fragment-ktx:1.8.6"
  implementation "com.google.android.material:material:1.13.0"
  implementation "androidx.constraintlayout:constraintlayout:2.2.1"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
  implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
  implementation "androidx.lifecycle:lifecycle-common-java8:2.10.0"
  implementation "androidx.recyclerview:recyclerview:1.3.2"
  implementation "androidx.exifinterface:exifinterface:1.4.2"

  // Kotlin coroutines
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

  // Gson
  implementation "com.google.code.gson:gson:2.13.2"

  // SDP (scalable dimension provider used in layouts)
  implementation "com.intuit.sdp:sdp-android:1.1.1"

  // PhotoView for gallery zoom
  implementation 'com.github.chrisbanes:PhotoView:2.3.0'

  // Splashscreen
  implementation "androidx.core:core-splashscreen:1.2.0"
}
